services:
  - type: web
    name: sterling-interview-portal-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Paste your Supabase URI in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false          # Set to your Vercel frontend URL (e.g. https://your-app.vercel.app)
      - key: SMTP_USER
        sync: false          # Gmail address for OTP emails
      - key: SMTP_PASS
        sync: false          # Gmail App Password (NOT your main password)
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
