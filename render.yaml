services:
  - type: web
    name: ai-interview-portal-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # You will paste your Supabase URI in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false          # Set to your Vercel URL after frontend is deployed
